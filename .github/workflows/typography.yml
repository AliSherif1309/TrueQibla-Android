name: Arabic typography
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Packaging input checks
        run: python -m unittest discover -s tools -p test_prepare_thmanyah.py
      - name: Android typography tests, lint and debug build
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify offline APK font assets
        run: python tools/prepare_thmanyah.py --check-apk app/build/outputs/apk/debug/app-debug.apk
