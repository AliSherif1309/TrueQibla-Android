name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TrueQibla.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TrueQibla-apk
          path: TrueQibla.apk
      - name: Publish as the "latest" release (direct download on the phone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TrueQibla.apk --title "True Qibla (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download TrueQibla.apk on your phone and open it to install."
