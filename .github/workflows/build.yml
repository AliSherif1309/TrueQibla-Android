name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "A persistent signing keystore is required for in-app updates. Configure the SIGNING_KEYSTORE_BASE64 and SIGNING_* secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          python -m unittest discover -s scripts -p 'test_*.py'
          gradle testDebugUnitTest lintDebug assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk TrueQibla.apk
          python scripts/make_update_manifest.py TrueQibla.apk app/build/outputs/apk/release/output-metadata.json update.json
      - uses: actions/upload-artifact@v4
        with:
          name: TrueQibla-apk
          path: |
            TrueQibla.apk
            update.json
      - name: Publish APK and update metadata together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" TrueQibla.apk update.json --draft --target "$GITHUB_SHA" --title "True Qibla 1.6 (build ${GITHUB_RUN_NUMBER})" \
            --notes "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}). Includes in-app updates. Install **TrueQibla.apk** once; future releases can be downloaded from Settings inside the app. Android confirms installation."
          gh release edit "$tag" --draft=false --latest
